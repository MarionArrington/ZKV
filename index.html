<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hradná pracovňa</title>
    <style>
        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Georgia', serif;
            overflow: hidden;
        }

        .workspace-container {
            position: relative;
            max-width: 1000px;
            width: 100%;
        }

        .main-image {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
        }

        /* Plynulé žmurknutie */
        .owl-blink-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://i.ibb.co/vCyCDWsR/zatvoren-o-i.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 2;
            opacity: 0; 
            animation: stableBlink 6s infinite ease-in-out;
        }

        @keyframes stableBlink {
            0%, 84%, 100% { opacity: 0; }
            87%, 91% { opacity: 1; }
        }

        /* Klikacie oblasti (hotspoty) */
        .hotspot {
            position: absolute;
            cursor: pointer;
            z-index: 5;
        }

        .hotspot.hodiny {
            top: 22%;
            left: 2%;
            width: 8%;
            height: 20%;
        }

        .hotspot.salka {
            top: 70%;
            left: 4%;
            width: 14%;
            height: 20%;
        }

        .hotspot.pergamen {
            top: 60%;
            left: 39%;
            width: 27%;
            height: 29%;
        }

        .hotspot.fotografia {
            top: 38%;
            left: 76%;
            width: 22%;
            height: 38%;
        }

        .hotspot.sova {
            top: 9%;
            left: 71%;
            width: 13%;
            height: 29%;
        }

        /* --- ANIMOVANÉ PRVKY --- */

        .flame-glow {
            position: absolute;
            top: 53%;
            left: 65%;
            width: 55px;
            height: 55px;
            background: radial-gradient(circle, rgba(255,240,150,0.95) 0%, rgba(255,120,0,0.7) 50%, rgba(255,60,0,0.2) 80%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 4;
            mix-blend-mode: screen;
            animation: strongFlicker 1s infinite alternate ease-in-out;
        }

        @keyframes strongFlicker {
            0% { transform: scale(0.8); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.85; }
        }

        .steam-container {
            position: absolute;
            top: 45%;
            left: 6%;
            width: 60px;
            height: 130px;
            pointer-events: none;
            z-index: 4;
            filter: blur(6px);
        }

        .steam-particle {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 55px;
            height: 55px;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 50%;
            animation: riseNaturalSteam 2.2s infinite linear;
        }

        .steam-particle:nth-child(2) {
            animation-delay: 1.1s;
            width: 45px;
            height: 45px;
            left: 10px;
        }

        @keyframes riseNaturalSteam {
            0% { transform: translate(0, 0) scale(0.4); opacity: 0; }
            20% { opacity: 0.7; }
            100% { transform: translate(15px, -110px) scale(2.2) rotate(8deg); opacity: 0; }
        }

        .curtain-anim {
            position: absolute;
            top: 2%;
            left: 26.5%;
            width: 8%;
            height: 42%;
            pointer-events: none;
            z-index: 4;
            background: linear-gradient(90deg, rgba(255,255,255,0.15), transparent);
        }

        /* --- MODÁLNE OKNO --- */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            z-index: 100;
        }

        .modal-backdrop.active {
            visibility: visible;
            opacity: 1;
        }

        .scroll-container {
            position: relative;
            width: 90%;
            max-width: 850px;
            transform-origin: top center;
            transform: scaleY(0);
            opacity: 0;
            transition: transform 0.9s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.5s ease;
        }

        /* Špeciálna trieda pre menší pergamen (hodiny) */
        .scroll-container.small-scroll {
            max-width: 450px;
        }

        .modal-backdrop.active .scroll-container {
            transform: scaleY(1);
            opacity: 1;
        }

        .scroll-image {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.8));
        }

        .scroll-text-content {
            position: absolute;
            top: 15%;
            left: 10%;
            width: 80%;
            height: 70%;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            text-align: center;
            color: #2b1705;
            font-family: 'Georgia', serif;
            overflow-y: auto;
            padding: 10px;
            opacity: 0;
            transition: opacity 0.4s ease 0.5s;
        }

        .modal-backdrop.active .scroll-text-content {
            opacity: 1;
        }

        .scroll-text-content h2 {
            margin-top: 5px;
            color: #4a270b;
            font-size: 1.3rem;
            border-bottom: 2px solid #b8915c;
            padding-bottom: 5px;
            margin-bottom: 8px;
            width: 100%;
        }

        .scroll-text-content p {
            font-size: 0.9rem;
            line-height: 1.4;
            margin-bottom: 12px;
            text-align: left;
        }

        .profile-layout { 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            gap: 25px; 
            width: 100%; 
            text-align: left; 
        }
        .profile-text-side { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
        }
        .profile-title { 
            font-size: 1.45rem; 
            font-weight: bold; 
            color: #4a270b; 
            margin: 0 0 4px 0; 
            border: none !important;
        }
        .profile-subtitle { 
            font-size: 1.05rem; 
            font-style: italic; 
            color: #5c3a21; 
            margin: 0 0 20px 0; 
        }
        .profile-text { 
            font-size: 0.95rem; 
            line-height: 1.5; 
            margin: 0; 
        }
        .profile-photos-side { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            align-items: flex-end; 
            position: relative; 
            min-width: 190px; 
        }
        .photo-main { 
            width: 155px; 
            height: 190px; 
            object-fit: cover; 
            border: 4px solid #fff; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.35); 
            z-index: 2; 
        }
        .photo-secondary { 
            width: 115px; 
            height: 115px; 
            object-fit: cover; 
            border: 4px solid #fff; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.35); 
            position: absolute; 
            top: 105px; 
            right: 105px; 
            z-index: 3; 
        }
        .contacts-wrapper { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; 
            gap: 10px; 
        }
        .contacts-intro { 
            font-size: 0.95rem; 
            font-style: italic; 
            color: #5c3a21; 
            margin-bottom: 5px; 
            text-align: center; 
        }
        .contacts-list { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            width: 100%; 
            max-width: 400px; 
            align-items: flex-start; 
        }
        .contact-item { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            font-size: 0.95rem; 
            color: #2b1705; 
        }
        .contact-icon { 
            width: 26px; 
            height: 26px; 
            object-fit: contain; 
            border-radius: 50%; 
        }

        .close-btn {
            position: absolute;
            top: 6%;
            right: 10%;
            background: rgba(92, 58, 33, 0.15);
            border: 2px solid #5c3a21;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            line-height: 1;
            cursor: pointer;
            color: #4a270b;
            z-index: 10;
            transition: all 0.2s ease;
        }

        .close-btn:hover {
            background: #5c3a21;
            color: #fff;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <div class="workspace-container">
        <img src="https://i.ibb.co/tT4pQm75/pracovna.png" alt="Pracovňa" class="main-image">
        <div class="owl-blink-layer"></div>
        <div class="flame-glow"></div>
        <div class="steam-container">
            <div class="steam-particle"></div>
            <div class="steam-particle"></div>
        </div>
        <div class="curtain-anim"></div>

        <div class="hotspot hodiny" onclick="showText('hodiny')" title="Hodiny"></div>
        <div class="hotspot salka" onclick="showText('salka')" title="Šálka"></div>
        <div class="hotspot pergamen" onclick="showText('pergamen')" title="Pergamen"></div>
        <div class="hotspot fotografia" onclick="showText('fotografia')" title="Fotografia"></div>
        <div class="hotspot sova" onclick="showText('sova')" title="Sova"></div>

        <div id="modal-backdrop" class="modal-backdrop" onclick="closeText()">
            <div class="scroll-container" id="scroll-box" onclick="event.stopPropagation()">
                <button class="close-btn" onclick="closeText()">&times;</button>
                <img src="https://i.ibb.co/7xYQz5dq/111ab02f-6b6b-4909-bda8-4ce4549fafc9-removebg-preview.png" alt="Pergamen" class="scroll-image">
                <div id="text-content" class="scroll-text-content"></div>
            </div>
        </div>
    </div>

<script>
const paperSound = new Audio('https://raw.githubusercontent.com/MarionArrington/ZKV/main/papier.wav');
const owlSound = new Audio('https://raw.githubusercontent.com/MarionArrington/ZKV/main/sova.wav');
const cupSound = new Audio('https://raw.githubusercontent.com/MarionArrington/ZKV/main/salka.wav');
const clockSound = new Audio('https://raw.githubusercontent.com/MarionArrington/ZKV/main/hodiny.wav');

let clockTimeout;

const texts = {
    pergamen: `<h2>Spôsob výučby</h2>
               <p>Ako isto viete, Základy kúzelníckeho vzdelania neprebiehajú formou online výuky, ale na príslušnú nástenku pridelenú triede ZKV C (sekcia 104) pribudnú každý týždeň nové zápisky. V rovnakom intervale budú zverejňované aj zadania domácich úloh.<br>Pre úspešné ukončenie predmetu a postup do ďalšieho ročníka je nutné získať minimálne päť známok, či už vďaka vyššie spomenutým prácam alebo povinnej polročnej a koncoročnej skúške.</p>
               
               <h2>Domáce úlohy</h2>
               <p>V každej zo zadaných nepovinných prác Vám bude ponúknutých hneď niekoľko možností vypracovania, takže pevne verím, že si každý nájde to, ktoré bude najviac vyhovovať jeho záujmom a schopnostiam. Okrem formulára pod zadaním nám môžete úlohy zasielať i prostredníctvom Discordu, avšak v odosielacom formulári vždy uveďte, z akého účtu ste prácu odovzdali.</p>
               
               <h2>Učebnica</h2>
               <p>Počas roka budeme používať učebnicu Praise Eveleen: Základy kouzelnického vzdělání. Jej vlastnenie nie je povinné, no každý kto ju bude mať na konci 6. výukového týždňa v inventári, získa známku navyše.</p>`,
               
    fotografia: `<div class="profile-layout">
                    <div class="profile-text-side">
                        <h2 class="profile-title">Marion G. Arrington</h2>
                        <p class="profile-subtitle">praktikantka</p>
                        <p class="profile-text">Som profesionálna tanečnica, no od začiatku tohto roka pôsobím v Bradaviciach na pozícií praktikantky. Mojim hlavným zameraním sú Lektvary, Obrana proti čiernej mágií a Kúzelnícke liečiteľstvo. Spoločne sa budeme stretávať na hodinách ZKV, ktorých absolvovanie je, nariadením Ministerstva mágie, povinným pre všetkých študentov školy.</p>
                    </div>
                    <div class="profile-photos-side">
                        <img src="https://i.ibb.co/HvYD9RR/740full-mariia-arsentieva.jpg" alt="Marion hlavná" class="photo-main">
                        <img src="https://i.ibb.co/nsF6x8Pj/ZABS4-Ath-400x400.jpg" alt="Marion portrét" class="photo-secondary">
                    </div>
                   </div>`,
    sova: `<h2>Sovička a odkazy</h2>
           <div class="contacts-wrapper">
               <p class="contacts-intro">Ak mi chceš niečo odkázať, pošli sovou list alebo ma zastihni tu:</p>
               <div class="contacts-list">
                   <div class="contact-item">
                       <img src="https://i.ibb.co/GfNHdQt8/1.png" alt="Email" class="contact-icon">
                       <span>i.arden@revelio.cz</span>
                   </div>
                   <div class="contact-item">
                       <img src="https://i.ibb.co/5WyLF5X8/2.png" alt="Discord" class="contact-icon">
                       <span>isabellearden</span>
                   </div>
                   <div class="contact-item">
                       <img src="https://i.ibb.co/5WyLF5X8/2.png" alt="Discord" class="contact-icon">
                       <span>Ardenkin pavilón šeliem</span>
                   </div>
               </div>
           </div>`,
    hodiny: `<h2>Upozornenie</h2><p style="font-size: 1.15rem; margin-top: 15px;">Nezabudnite pravidelne kontrolovať nástenku.</p>`
};

function showText(target) {
    const backdrop = document.getElementById('modal-backdrop');
    const textContent = document.getElementById('text-content');
    const scrollBox = document.getElementById('scroll-box');

    clearTimeout(clockTimeout);
    clockSound.pause();

    if (target === 'salka') {
        cupSound.currentTime = 0;
        cupSound.play().catch(error => console.log("Zvuk šálky zablokovaný:", error));
        return;
    }

    if (texts[target]) {
        textContent.innerHTML = texts[target];
        
        if (target === 'hodiny') {
            scrollBox.classList.add('small-scroll');
        } else {
            scrollBox.classList.remove('small-scroll');
        }

        backdrop.classList.add('active');
        
        if (target === 'pergamen') {
            paperSound.currentTime = 0;
            paperSound.play().catch(error => console.log("Zvuk papiera zablokovaný:", error));
        } else if (target === 'sova') {
            owlSound.currentTime = 0;
            owlSound.play().catch(error => console.log("Zvuk sovy zablokovaný:", error));
        } else if (target === 'hodiny') {
            clockSound.currentTime = 0;
            clockSound.play().catch(error => console.log("Zvuk hodín zablokovaný:", error));
            
            clockTimeout = setTimeout(() => {
                clockSound.pause();
            }, 2500);
        }
    }
}

function closeText() {
    const backdrop = document.getElementById('modal-backdrop');
    backdrop.classList.remove('active');
    
    clearTimeout(clockTimeout);
    clockSound.pause();
}
</script>
</body>
</html>
